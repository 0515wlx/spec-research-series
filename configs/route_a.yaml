# Route A experiment config
seed: 0
dtype: bfloat16
greedy: true
max_new: 512
max_prompt_tokens: 1536
seq_len_wikitext: 1024

accept_eval:
  topk: 256
  gammas: [1, 2, 4, 8, 16, 32, 64]
  ks: [1, 2, 3, 5, 8, 12, 16, 24, 32, 48, 64]
  batch_size: 4

real_loop:
